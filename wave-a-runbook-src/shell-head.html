<title>Happy Wave A Runbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
/* Layout: the roadmap's runbook layout — sticky phase rail on the left, numbered step cards on the right.
   Tokens are copied from the Home Agent Roadmap so the three documents read as one set. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#E9EFF1; --ink:#16202A; --muted:#586772; --line:#D3DBE0;
  --accent:#0E6B6F; --accent-ink:#0A5255; --accent-soft:#DCEFEE;
  --you:#A2621A; --you-soft:#FAEDDA;
  --sec:#B0362F; --sec-soft:#F8E1DF;
  --obs:#6A4FB0; --obs-soft:#ECE6F8;
  --ok:#2C7A4E; --ok-soft:#E1F1E6;
  --code:#EEF2F4; --codebg:#16202A; --codeink:#E3E9ED; --codemuted:#8FA0AC;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 8px 24px rgba(22,32,42,.06);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1417; --surface:#151C21; --surface-2:#1C252B; --ink:#E3E9ED; --muted:#98A6B1; --line:#283339;
    --accent:#5BC4C6; --accent-ink:#8EDEDF; --accent-soft:#11383A;
    --you:#E1A75C; --you-soft:#3A2A12;
    --sec:#EA7B74; --sec-soft:#42201E;
    --obs:#A994E8; --obs-soft:#2A2344;
    --ok:#6FC596; --ok-soft:#153226;
    --code:#1A2328; --codebg:#0A0F12; --codeink:#E3E9ED; --codemuted:#7F909B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1417; --surface:#151C21; --surface-2:#1C252B; --ink:#E3E9ED; --muted:#98A6B1; --line:#283339;
  --accent:#5BC4C6; --accent-ink:#8EDEDF; --accent-soft:#11383A;
  --you:#E1A75C; --you-soft:#3A2A12;
  --sec:#EA7B74; --sec-soft:#42201E;
  --obs:#A994E8; --obs-soft:#2A2344;
  --ok:#6FC596; --ok-soft:#153226;
  --code:#1A2328; --codebg:#0A0F12; --codeink:#E3E9ED; --codemuted:#7F909B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:2px;overflow-wrap:anywhere}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:0 64px}
.masthead{padding-block:40px 28px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 14px;text-wrap:balance}
.lede{font-size:18px;max-width:72ch;margin:0 0 18px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr;gap:32px;padding-top:28px}
@media (min-width:1024px){.layout{grid-template-columns:210px minmax(0,1fr);gap:44px}}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-top:8px;display:none;max-height:100vh;overflow-y:auto}
@media (min-width:1024px){nav.toc{display:block}}
nav.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
nav.toc li a{display:flex;justify-content:space-between;gap:8px;padding:6px 0 6px 14px;font-size:13.5px;color:var(--muted);text-decoration:none;border-left:2px solid transparent;margin-left:-1px}
nav.toc li a:hover{color:var(--ink)}
nav.toc li a.active{color:var(--accent-ink);border-left-color:var(--accent)}
nav.toc .cnt{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
nav.toc .cnt.full{color:var(--ok)}
.progress{margin:0 0 16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.progress .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
main{min-width:0}
section.sec{padding-block:8px 40px;border-bottom:1px solid var(--line);margin-bottom:28px;scroll-margin-top:12px}
section.sec:last-of-type{border-bottom:0}
h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,3vw,34px);line-height:1.1;letter-spacing:-.015em;margin:6px 0 14px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25;margin:26px 0 10px;text-wrap:balance}
p{max-width:74ch;margin:0 0 14px}
ul,ol{max-width:74ch;padding-left:22px;margin:0 0 14px}
li{margin-bottom:6px}
li::marker{color:var(--muted)}
strong{font-weight:600}
code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
.callout{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px 18px;margin:18px 0;max-width:84ch}
.callout.note{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}
.callout.warn{border-color:color-mix(in srgb,var(--sec) 45%,var(--line));background:var(--sec-soft)}
.callout .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
/* executor chips */
.who{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap;font-weight:500}
.who.you{color:var(--you);background:var(--you-soft)}
.who.cc{color:var(--accent-ink);background:var(--accent-soft)}
.where{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:1px 7px;border-radius:3px;white-space:nowrap;color:var(--muted);border:1px solid var(--line)}
.rec{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:3px;white-space:nowrap;font-weight:500;color:var(--ok);background:var(--ok-soft)}
.rec.open{color:var(--you);background:var(--you-soft)}
.rec.defer{color:var(--muted);background:var(--surface-2)}
.st-hd input[type=checkbox]:disabled{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:4px 0 18px;font-size:14px;align-items:center}
.legend span{display:inline-flex;gap:8px;align-items:center}
/* phase */
.phase-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.phase-hd .pid{font-family:var(--mono);font-size:13px;color:var(--accent-ink);font-weight:500}
.phase-hd .when{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.phase-intro{color:var(--ink);margin-bottom:18px}
/* step card */
.step{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px 14px;margin:0 0 14px;scroll-margin-top:12px;min-width:0}
.step.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.step.done .st-title{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.st-hd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.st-hd input[type=checkbox]{width:20px;height:20px;margin:3px 0 0;accent-color:var(--ok);cursor:pointer}
.st-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.st-id{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.st-title{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.3;margin:0}
.st-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st-body{margin-top:10px;font-size:15px;min-width:0}
.st-body p,.st-body ul,.st-body ol{font-size:15px}
.st-body ol li,.st-body ul li{margin-bottom:4px}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.cmd{position:relative;margin:6px 0 12px;min-width:0}
.cmd pre{margin:0;background:var(--codebg);color:var(--codeink);font-family:var(--mono);font-size:13px;line-height:1.55;padding:12px 14px;padding-right:64px;border-radius:5px;overflow-x:auto;white-space:pre}
.cmd pre .c{color:var(--codemuted)}
.cmd button{position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:4px;border:1px solid color-mix(in srgb,var(--codeink) 30%,transparent);background:transparent;color:var(--codeink);cursor:pointer}
.cmd button:hover{background:color-mix(in srgb,var(--codeink) 12%,transparent)}
.cmd .fn{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:4px}
.done-when{font-size:14.5px;border-top:1px dashed var(--line);margin-top:12px;padding-top:9px}
.done-when strong{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);font-weight:500;margin-right:6px}
.src{font-size:13px;color:var(--muted);margin-top:6px}
.src a{color:var(--muted)}
.src strong{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-right:6px}
.why{font-size:14px;color:var(--muted);margin:6px 0 0}
details.more{margin:8px 0 0;font-size:14.5px}
details.more summary{cursor:pointer;color:var(--accent-ink);font-size:14px}
.gate{display:grid;gap:10px;margin:14px 0}
.gate .g{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.gate .g .k{font-family:var(--mono);font-size:12px;color:var(--sec);font-weight:500;padding-top:2px;white-space:nowrap}
.gate .g p{margin:0;font-size:15px}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 18px;font-size:14.5px;margin:10px 0 18px;max-width:84ch}
.kv dt{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.kv dd{margin:0;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0}
.toolbar button{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.toolbar button:hover{border-color:var(--accent)}
.sources{font-size:13px;line-height:1.5}
@media (min-width:900px){.sources{columns:2;column-gap:36px}}
.sources h4{column-span:all;margin:18px 0 8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sources ul{list-style:none;padding:0;margin:0;max-width:none}
.sources li{break-inside:avoid;margin:0 0 7px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media (prefers-reduced-motion:reduce){.progress .bar i{transition:none}}
</style>
