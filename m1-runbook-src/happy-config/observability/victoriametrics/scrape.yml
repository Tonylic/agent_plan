# VictoriaMetrics -promscrape.config (O1). Prometheus scrape_configs format.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: openclaw            # diagnostics-prometheus plugin on the gateway port
    metrics_path: /api/diagnostics/prometheus
    authorization:                 # type defaults to Bearer
      credentials_file: /Users/happy/.config/happy/run/openclaw-scrape-token
    static_configs:
      - targets: ["127.0.0.1:18789"]

  - job_name: macmon
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
