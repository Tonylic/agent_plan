; Grafana 13 overrides for happy (O1). Everything not set here comes from
; /opt/homebrew/opt/grafana/share/grafana/conf/defaults.ini.
[paths]
data = /Users/happy/.local/share/grafana
logs = /Users/happy/Library/Logs/happy/grafana
plugins = /Users/happy/.local/share/grafana/plugins
provisioning = /Users/happy/.config/happy/observability/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000

[security]
admin_user = admin
admin_password = $__file{/Users/happy/.config/happy/grafana-admin-password}
secret_key = $__file{/Users/happy/.config/happy/grafana-secret-key}
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[public_dashboards]
enabled = false

[plugins]
; Grafana 13.2 downloads its Prometheus datasource plugin at startup unless this is set; it is installed once by hand (runbook F2).
preinstall_disabled = true
plugin_admin_enabled = false
public_key_retrieval_disabled = true

[unified_alerting]
enabled = true

[log]
mode = file
