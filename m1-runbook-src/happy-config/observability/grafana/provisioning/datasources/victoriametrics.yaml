apiVersion: 1
prune: true
datasources:
  - name: VictoriaMetrics
    type: prometheus
    uid: vm
    access: proxy
    url: http://127.0.0.1:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.24.0
      timeInterval: 30s
