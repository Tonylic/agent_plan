apiVersion: 1
policies:
  - orgId: 1
    receiver: ntfy
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # The watchdog (rules.yaml) goes only to healthchecks.io: a ping every 5 minutes or so while it fires.
      - receiver: healthchecks
        object_matchers:
          - ['watchdog', '=', 'true']
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 5m
